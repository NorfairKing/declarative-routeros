name: routeros-check
version: 0.0.0

# -Werror because an inexhaustive problemCode would let a problem lose its
# code, and a code is what ties it to an example.
ghc-options:
  - -Wall
  - -Werror

library:
  source-dirs: src
  dependencies:
    - aeson
    - aeson-pretty
    - base
    - bytestring
    - containers
    - diagnose
    - http-client
    - http-client-tls
    - http-types
    - iproute
    - opt-env-conf
    - path
    - path-io
    - prettyprinter
    - prettyprinter-ansi-terminal
    - safe-coloured-text
    - text

executables:
  routeros-check:
    main: Main.hs
    source-dirs: app
    dependencies:
      - base
      - routeros-check

  # Run by a deployment once it has recorded the router, and by .postflight.
  routeros-postflight:
    main: Main.hs
    source-dirs: postflight
    dependencies:
      - base
      - routeros-check

  # Run by hand every so often, with its output committed as
  # nix/chr-images.json: it asks MikroTik, so no build can.
  update-chr-images:
    main: Main.hs
    source-dirs: update-chr-images
    dependencies:
      - base
      - routeros-check

tests:
  routeros-check-test:
    main: Spec.hs
    source-dirs: test
    dependencies:
      - QuickCheck
      - aeson
      - base
      - containers
      - path
      - path-io
      - routeros-check
      - safe-coloured-text
      - sydtest
      - text

  # Separate because it boots a router per example: minutes rather than
  # milliseconds, and it needs qemu and an image that cannot be cached.
  routeros-check-vmtest:
    main: Spec.hs
    source-dirs: test-vm
    dependencies:
      - aeson
      - base
      - network
      - path
      - path-io
      - process
      - routeros-check
      - safe-exceptions
      - sydtest
      - text
